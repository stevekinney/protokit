name: Security Scan

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-and-filesystem:
    name: Dependency, secret, and filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks needs full history, not a shallow clone

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # SUPPLY-001 (S-08): the locked dependency graph itself, every
      # severity. A regression here means a transitive dependency moved
      # backward or a fresh advisory was published against a pinned
      # version — either way it should block the merge, not silently pass.
      - name: bun audit (dependency advisories)
        run: bun audit --audit-level=high

      # SUPPLY-001: filesystem-wide dependency, Dockerfile misconfiguration,
      # and secret scan — the source tree, not only the built image.
      - name: trivy fs (vuln, secret, misconfig)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret,misconfig .

      # SUPPLY-001 (S-12/S-19 adjacent): full git history secret scan, not
      # only the working tree — a secret committed and later deleted is
      # still a leaked secret. `.gitleaks.toml` documents every reviewed
      # allowlist entry with its rationale; a new finding must be fixed,
      # not silently widened into that file.
      - name: gitleaks (full history secret scan)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --exit-code 1 --redact /repo

  image-scan:
    name: Container image scan, SBOM, and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Build production image
        run: docker build --no-cache -t protokit-security-scan .

      # SUPPLY-001: scan the artifact that actually ships, not only its
      # source lockfile — a base-image OS advisory, a build-stage dependency
      # that leaks into the runtime layer, or a secret baked into a layer
      # only shows up here.
      - name: trivy image (vuln, secret)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret protokit-security-scan

      - name: Trivy config (Dockerfile misconfiguration)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            config --exit-code 1 --severity HIGH,CRITICAL Dockerfile

      - name: Structural runtime image checks (non-root, no shell, healthcheck)
        run: bun run audit:runtime-image
        env:
          RUNTIME_IMAGE_TAG: protokit-security-scan

      - name: Generate SBOM and provenance statement
        run: bun run audit:provenance
        env:
          RUNTIME_IMAGE_TAG: protokit-security-scan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: dist/provenance/
          retention-days: 90
