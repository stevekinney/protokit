name: Production

on:
  push:
    branches: [main]

permissions: {}

# Serialize every production run for this workflow. A second push landing
# while a migration is in flight queues behind it instead of racing it.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Migrations
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires a protected "production" GitHub environment (required
    # reviewers and/or a restricted deployment branch policy configured in
    # the repository settings). That protection is what actually gates this
    # job, not the workflow file alone.
    environment: production
    permissions:
      contents: read
    outputs:
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Record revision and migration plan
        run: |
          set -euo pipefail
          echo "Migrating revision ${{ github.sha }} (ref: ${{ github.ref }})"
          echo "Pending migration plan:"
          cat packages/database/drizzle/meta/_journal.json

      - name: Snapshot pre-migration database (rollback evidence)
        id: backup
        uses: neondatabase/create-branch-action@ad7325f8b2fe61e29689926c29d153e8c98b7336 # v5.2.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pre-migration-${{ github.sha }}

      - name: Run migrations
        run: bun scripts/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Record rollback branch
        if: always()
        run: |
          echo "Rollback evidence: Neon branch 'pre-migration-${{ github.sha }}' (id: ${{ steps.backup.outputs.branch_id }}) captures the schema and data immediately before this migration ran. Restore it through the Neon dashboard or API if this revision must be rolled back."

  deploy:
    name: Deploy
    needs: migrate
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployment shares the same protected environment and only starts once
    # `migrate` has completed successfully, so an incompatible or failed
    # migration can never be followed by an application deploy from this
    # workflow. This job assumes Railway's own "deploy on push" git
    # integration has been disabled for this service so this step is the
    # only trigger; see the CI-SEC-001 progress notes for that prerequisite.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.migrate.outputs.revision }}

      - name: Deploy to Railway
        run: bunx @railway/cli@5 up --service "${{ vars.RAILWAY_SERVICE_NAME }}" --detach --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
