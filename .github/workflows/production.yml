name: Production

on:
  push:
    branches: [main]

permissions: {}

# Serialize every production run for this workflow. A second push landing
# while a migration is in flight queues behind it instead of racing it.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Migrations
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires a protected "production" GitHub environment (required
    # reviewers and/or a restricted deployment branch policy configured in
    # the repository settings). That protection is what actually gates this
    # job, not the workflow file alone.
    environment: production
    permissions:
      contents: read
    outputs:
      revision: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - run: bun install --frozen-lockfile

      - name: Record revision and migration plan
        run: |
          set -euo pipefail
          echo "Migrating revision ${{ github.sha }} (ref: ${{ github.ref }})"
          echo "Pending migration plan:"
          cat packages/database/drizzle/meta/_journal.json

      - name: Snapshot pre-migration database (rollback evidence)
        id: backup
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pre-migration-${{ github.sha }}

      # If DATABASE_URL points at a database that already had these tables
      # before this repository tracked Drizzle migrations (for example, an
      # earlier fork of this template deployed before migration 0000
      # existed), this step fails on its first run with "relation already
      # exists". See packages/database/CLAUDE.md ("Baselining a database
      # that predates tracked migrations") and run
      # `bun scripts/baseline-existing-database.ts` against that database
      # once, out of band, before re-running this workflow. A fresh
      # database needs none of this.
      - name: Run migrations
        run: bun scripts/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      - name: Record rollback branch
        if: always()
        run: |
          echo "Rollback evidence: Neon branch 'pre-migration-${{ github.sha }}' (id: ${{ steps.backup.outputs.branch_id }}) captures the schema and data immediately before this migration ran. Restore it through the Neon dashboard or API if this revision must be rolled back."

  deploy:
    name: Deploy
    needs: migrate
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployment shares the same protected environment and only starts once
    # `migrate` has completed successfully, so an incompatible or failed
    # migration can never be followed by an application deploy from this
    # workflow. This job assumes Railway's own "deploy on push" git
    # integration has been disabled for this service so this step is the
    # only trigger; see the CI-SEC-001 progress notes for that prerequisite.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.migrate.outputs.revision }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - run: bun install --frozen-lockfile

      # Pinned to an exact, immutable version rather than the mutable `@5` range:
      # RAILWAY_TOKEN is in scope for this step, so the CLI that runs beside it must be a
      # reviewed version, not "whatever 5.x is newest today".
      #
      # Deliberately NOT a devDependency. Vendoring the CLI into the dependency graph does
      # buy a lockfile integrity hash, but it also drags its transitive tree into this
      # project's own dependency graph -- `@railway/cli@5.43.1` depends on `tar@6.2.1`,
      # which carries nine advisories including a critical, and `bun audit` (rightly) fails
      # the security gate on them. This is deploy-time tooling that never ships in the
      # runtime image; adopting a vulnerable tree permanently to pin a CLI we invoke once
      # is a bad trade. An exact npm version cannot be republished, so the mutable-resolution
      # problem is solved either way.
      - name: Deploy to Railway
        run: bunx @railway/cli@5.43.1 up --service "${{ vars.RAILWAY_SERVICE_NAME }}" --detach --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
