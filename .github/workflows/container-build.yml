name: Container Build

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: container-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cold build and first-request smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - run: bun install --frozen-lockfile

      # DEPLOY-001: a no-cache build from a clean checkout with the frozen
      # lockfile must succeed, and the resulting image must actually start,
      # serve health and discovery endpoints, and correctly challenge an
      # unauthenticated MCP request. `test:container-smoke` also verifies
      # that two consecutive clean asset builds produce the same declared
      # file set with no stale asset and no published source map.
      - name: Cold container build and smoke test
        run: bun run test:container-smoke
