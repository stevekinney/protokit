name: Pull Request

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun turbo typecheck

      - name: Lint
        run: bun turbo lint

      # These are root `scripts/` and `.github/` gates, not `applications/*`/`packages/*`
      # workspace tests, so `bun turbo test` below never runs them (turbo only knows about
      # the workspaces declared in the root package.json). CI-SEC-001/CI-SEC-002 built these
      # as named `bun run` commands but never wired them into a workflow, so they never ran
      # anywhere -- a gate nobody runs is not a gate. All five are infra-free (no Postgres/
      # Redis dependency), so they run here, before the infrastructure spin-up, to fail fast.
      - name: Workflow policy audit (permissions, timeouts, SHA pins, auth gating)
        run: bun run audit:workflows

      - name: Workflow authorization gate tests
        run: bun run test:workflow-authorization

      - name: Workflow prompt-injection gate tests
        run: bun run test:workflow-prompt-injection

      - name: Production migration gate tests
        run: bun run test:production-migration-gate

      - name: Root scripts security tests
        run: bun run test:scripts-security

      # Real Postgres (behind a Neon-compatible HTTP proxy) and Redis, the
      # same stack `bun run test:infrastructure:*` brings up locally, so the
      # Redis- and database-backed tests run for real instead of skipping
      # (see BUG-001/BUG-002 in PROGRESS.local.md) or being masked by
      # SKIP_ENV_VALIDATION discarding every Zod default.
      - name: Bring up test infrastructure (Postgres, Neon proxy, Redis)
        run: bun run test:infrastructure:up

      - name: Apply database migrations
        run: bun run test:infrastructure:migrate

      # INTEROP-001: an unexpected skip must fail the build, not read as
      # green -- this branch's own history has three separate incidents
      # where a suite passed only because the test that mattered never ran.
      # `assert-no-unexpected-skips.ts` runs the real command, streams its
      # output live, and fails if `bun:test`'s own `N skip` summary line
      # (only ever printed when N > 0) appears anywhere in it.
      - name: Test (fails on any unexpected skip)
        run: bun scripts/assert-no-unexpected-skips.ts -- bun turbo test
        env:
          REDIS_URL: 'redis://localhost:6379'

      - name: Tear down test infrastructure
        if: always()
        run: bun run test:infrastructure:down

      - name: Build
        run: bun turbo build
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
          DATABASE_URL_UNPOOLED: 'postgresql://ci:ci@localhost:5432/ci'
          SESSION_SIGNING_SECRET: 'ci-placeholder-secret-at-least-32-chars'
          GOOGLE_CLIENT_ID: 'ci-placeholder'
          GOOGLE_CLIENT_SECRET: 'ci-placeholder'
          SESSION_COOKIE_NAME: 'application_session'
          SESSION_TIME_TO_LIVE_SECONDS: '2592000'
          REDIS_URL: 'redis://localhost:6379'
          RATE_LIMIT_REGISTER_MAX: '10'
          RATE_LIMIT_REGISTER_WINDOW_SECONDS: '60'
          RATE_LIMIT_TOKEN_MAX: '30'
          RATE_LIMIT_TOKEN_WINDOW_SECONDS: '60'
          MCP_ALLOWED_ORIGINS: 'http://localhost:3000'
          MCP_ENABLE_UI_EXTENSION: 'true'
          MCP_ENABLE_ENTERPRISE_AUTH: 'false'
          MCP_CONFORMANCE_MODE: 'false'
          LOG_LEVEL: 'info'

  # INTEROP-001: modern (`2026-07-28`) and legacy (`2025-11-25`) conformance
  # each get their own job, run in parallel with `check` rather than as two
  # sequential steps bolted onto it -- the roadmap's compatibility contract
  # requires proving both eras, not just the one Claude's hosted connector
  # currently documents. Both jobs run the exact same
  # `packages/mcp/src/conformance-server.ts` (the one SDK v2 factory PROTO-001
  # built to serve both eras) against the pinned, locked
  # `@modelcontextprotocol/conformance` CLI -- never an unpinned `bunx`
  # download. The 0.2.x line is a pre-stable alpha (no stable release
  # supports `2026-07-28` yet); the roadmap names this explicitly as a
  # temporary state to revisit once a stable release covers the current
  # specification.
  mcp-conformance-legacy:
    name: MCP Conformance (2025-11-25)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # The pinned conformance CLI ships a `node`-shebang binary.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Start conformance server
        run: |
          (cd packages/mcp && MCP_CONFORMANCE_PORT=3137 NODE_ENV=test bun ./src/conformance-server.ts) &
          echo $! > /tmp/conformance-server.pid

      # Replaces a fixed `sleep` with a real, bounded readiness probe --
      # fails after 5 attempts instead of racing a server that hasn't
      # finished booting or hanging on one that never will.
      - name: Wait for conformance server
        run: bun scripts/wait-for-http.ts http://127.0.0.1:3137/mcp --max-attempts 5

      - name: Run conformance (server, 2025-11-25)
        run: |
          bunx --bun @modelcontextprotocol/conformance server \
            --url http://127.0.0.1:3137/mcp \
            --spec-version 2025-11-25 \
            --expected-failures .github/conformance/legacy-expected-failures.yaml

      - name: Stop conformance server
        if: always()
        run: kill "$(cat /tmp/conformance-server.pid)" 2>/dev/null || true

  mcp-conformance-modern:
    name: MCP Conformance (2026-07-28)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Start conformance server
        run: |
          (cd packages/mcp && MCP_CONFORMANCE_PORT=3138 NODE_ENV=test bun ./src/conformance-server.ts) &
          echo $! > /tmp/conformance-server.pid

      - name: Wait for conformance server
        run: bun scripts/wait-for-http.ts http://127.0.0.1:3138/mcp --max-attempts 5

      - name: Run conformance (server, 2026-07-28)
        run: |
          bunx --bun @modelcontextprotocol/conformance server \
            --url http://127.0.0.1:3138/mcp \
            --spec-version 2026-07-28

      - name: Stop conformance server
        if: always()
        run: kill "$(cat /tmp/conformance-server.pid)" 2>/dev/null || true

  validate-database:
    name: Validate Database
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Create Neon branch
        id: neon-branch
        uses: neondatabase/create-branch-action@ad7325f8b2fe61e29689926c29d153e8c98b7336 # v5.2.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.pull_request.number }}

      - name: Validate schema
        run: bun turbo db:validate
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_with_pooler }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon-branch.outputs.db_url }}

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: pr-${{ github.event.pull_request.number }}
