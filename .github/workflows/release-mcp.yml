name: Release @lostgradient/mcp

# Publishing is a deliberate human act, so this never triggers on a push or a
# merge. There is exactly one path to the registry: a published GitHub
# Release, which a person creates, gated behind a protected environment.
# `workflow_dispatch` rehearses the pipeline and cannot publish.
#
# The version guard and the publish step deliberately carry the SAME
# condition, so the guard cannot be skipped on a publish.
on:
  release:
    types: [published]
  # Rehearsal only — this path builds, packs, and verifies, and can never
  # publish. It carried a `dry_run` boolean that could be flipped to publish,
  # which made it a second publish path that also skipped the version guard
  # below (that step only runs for a release). One publish path, always
  # version-checked, is easier to reason about than two.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a protected "npm-publish" GitHub environment holding the
    # NPM_TOKEN secret, with required reviewers configured in the repository
    # settings. That protection is what actually gates publishing, not this
    # file: without it the token is an ordinary repository secret and any
    # collaborator with write access could reach the publish step. Same
    # reasoning, and the same pattern, as `production.yml`'s `production`
    # environment.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance, which attests that this tarball was built
      # by this workflow from this commit. Nothing else here needs write.
      id-token: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: protokit
          POSTGRES_PASSWORD: protokit
          POSTGRES_DB: protokit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protokit -d protokit_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      # npm rather than `bun publish`, for provenance: `--provenance` needs an
      # OIDC-aware npm client, and `registry-url` is what makes setup-node
      # write the `.npmrc` that reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      # The published version must equal the release tag. Without this, a
      # forgotten version bump publishes the previous version's contents under
      # a new tag, or fails opaquely on a duplicate version.
      - name: Verify the package version matches the release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./packages/mcp/package.json').version")"
          expected="${RELEASE_TAG#v}"
          if [ "$package_version" != "$expected" ]; then
            echo "Release tag is '$RELEASE_TAG' (version '$expected') but packages/mcp/package.json is '$package_version'." >&2
            exit 1
          fi
          echo "Version $package_version matches the release tag."

      # `version.ts` is a checked-in constant and the source of the version the
      # server advertises over the wire; its own test fails when it drifts from
      # package.json. Running it here means a mismatched pair cannot publish.
      - name: Test
        run: bun run --cwd packages/mcp test

      - name: Test Postgres OAuth adapter
        run: bun run --cwd packages/mcp test:postgres

      - name: Typecheck
        run: bun run --cwd packages/mcp typecheck

      - name: Build
        run: bun run --cwd packages/mcp build

      - name: Verify Client ID Metadata Document SSRF boundary on Bun and Node
        run: bun run --cwd packages/mcp verify:cimd-runtime

      # Proves the tarball is importable before it is published, not after.
      # Installs the packed artifact into a directory outside the workspace so
      # no workspace resolution can satisfy an import the published package
      # would leave unresolved.
      - name: Verify the packed tarball installs and imports on Node
        run: bun run --cwd packages/mcp verify:package

      - name: Publish to npm
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        # A scoped package defaults to restricted; without --access public the
        # publish either fails or succeeds privately, which is worse.
        #
        # The dist-tag is derived from the version *and* the GitHub flag, not
        # the flag alone. npm assigns `latest` when `--tag` is omitted, so a
        # semver prerelease published through a Release whose prerelease
        # checkbox was left unticked would silently become the version every
        # ordinary `npm install` resolves to. Either signal is enough to
        # withhold `latest`.
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag='next' ;;
            *) tag='latest' ;;
          esac
          if [ "$RELEASE_IS_PRERELEASE" = 'true' ]; then tag='next'; fi
          echo "Publishing $version under dist-tag '$tag'."
          npm publish --access public --provenance --tag "$tag"
        working-directory: packages/mcp

      - name: Rehearsal summary
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Rehearsal complete. The package was built, packed, and verified against a clean Node install, and nothing was published. Publish by creating a GitHub Release.'
