# INTEROP-001: known-failure baseline for the pinned
# `@modelcontextprotocol/conformance` CLI's `2025-11-25` (legacy) server run.
#
# `--expected-failures` is a feature of the pinned conformance package
# itself (not something this repository invented): it turns a listed
# scenario's failure into an informational "expected failure" line instead
# of a hard CI failure, AND fails the run if a listed scenario starts
# passing (a "stale baseline entry") -- so this file cannot silently rot
# into hiding a real regression once one of these is genuinely fixed.
#
# Every scenario listed here was verified directly against a real,
# unmodified instance of this server (`packages/mcp/src/conformance-server.ts`)
# running locally, not assumed from the scenario name:
#
# - `tools-call-sampling`, `tools-call-elicitation`,
#   `elicitation-sep1034-defaults`, `elicitation-sep1330-enums`: each times
#   out (`MCP error -32001: Request timed out`) rather than completing.
#
#   TEST-001 (OPEN-10) resolved the question this file previously left open.
#   `packages/mcp/src/conformance-fixture-registration.ts`'s `test_sampling`
#   / `test_elicitation*` fixtures call the SDK's own `sendRequest` (a real
#   server-initiated `sampling/createMessage` / `elicitation/create`
#   request) with no explicit `options.timeout`, but the await is NOT
#   unbounded: `@modelcontextprotocol/server@2.0.0`'s
#   `requestWithSchemaViaCodec` falls back to the SDK's own
#   `DEFAULT_REQUEST_TIMEOUT_MSEC` (60000ms, `core-internal/src/shared/
#   protocol.ts`) whenever the caller omits `timeout`, and rejects with
#   `SdkError(RequestTimeout, "Request timed out")` once it elapses -- which
#   is exactly the `-32001` this file's scenarios observe. Confirmed
#   empirically, not just read from source: running
#   `@modelcontextprotocol/conformance server --scenario tools-call-sampling
#   --verbose` against a real, unmodified `conformance-server.ts` measured
#   `1:00.49` wall-clock before the failure, matching the 60s default to
#   within CLI startup/teardown overhead. `packages/mcp/src/
#   conformance-sampling-timeout.test.ts` pins this behavior as a
#   regression test: it drives `test_sampling` against a real client that
#   registers a `sampling/createMessage` handler but never resolves it, and
#   asserts the call finishes bounded -- between 45s and 90s -- rather than
#   never, accepting either of the two equally-bounded ~60s outcomes a real
#   client can observe (the server's own `isError: true` result, or the
#   client's own `tools/call` request timing out first), so a future SDK
#   upgrade that removes the default (making the await genuinely unbounded)
#   fails this test rather than silently reintroducing the availability gap
#   the roadmap warned about.
#
#   That answers (b) from this file's prior wording: there is no genuine
#   unbounded-await gap. The four scenarios still fail here for reason (a):
#   the pinned `@modelcontextprotocol/conformance` CLI's own `server`-mode
#   test client does not implement an automatic sampling/elicitation
#   responder (confirmed by its own `--verbose` "Implementation Note" output
#   for `tools-call-sampling`, which describes what the *server* must
#   implement and says nothing about the CLI supplying a client-side
#   responder), so every one of these calls always times out against this
#   CLI regardless of server behavior. This is the CLI's client, not a
#   server-side defect -- these entries stay in the baseline, now for a
#   proven reason instead of an open question.
#
# - `server-sse-multiple-streams`: this CI job's own workflow (added in the
#   same commit as this file, alongside the modern-era job) had never
#   actually been executed until `INTEROP-001` ran it locally for the first
#   time -- and it exits nonzero as written, which would have been a first
#   real-run CI failure. Root cause, confirmed against a real, unmodified
#   `conformance-server.ts` (`--scenario server-sse-multiple-streams
#   --verbose`): the scenario's own result is a WARNING with 0 passed / 0
#   failed assertions ("Server did not provide session ID - multiple
#   streams test may not work correctly", referencing SEP-1699) -- not an
#   assertion failure. `PROTO-001` deliberately configures this legacy
#   (`2025-11-25`) server as `{ legacy: 'stateless' }` (see
#   `conformance-server.ts`), so it never issues an `Mcp-Session-Id`, which
#   this scenario checks for. The pinned CLI's "unexpected failures" bucket
#   flags any non-PASS status regardless of assertion count, so a WARNING
#   surfaces as a hard CI failure unless listed here. Confirmed this is
#   spec-version-specific, not a general defect: the same scenario against
#   the same server's modern (`2026-07-28`) era passes cleanly (1 passed,
#   0 failed) -- `2026-07-28` removes session identifiers from the protocol
#   entirely, so nothing there expects one. Re-verify against a stable
#   (non-alpha) conformance release before removing this entry.
server:
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - server-sse-multiple-streams
