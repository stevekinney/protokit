## Local integration-test infrastructure.
##
## Brings up a real Postgres instance behind a Neon-compatible HTTP proxy
## (`packages/database` speaks Neon's `neon-http` wire protocol, not raw
## Postgres) plus Redis, so the integration lane in `applications/web` and
## `packages/mcp` can run the same code path production uses instead of a
## mock or a skip.
##
## One-command up:   docker compose -f docker-compose.test.yml up -d --wait
## One-command down: docker compose -f docker-compose.test.yml down -v
##
## After the stack is up, run migrations once against it:
##   DATABASE_URL=postgresql://protokit:protokit@localhost:5432/protokit_test \
##   DATABASE_LOCAL_PROXY_URL=http://db.localtest.me:4444/sql \
##   bun scripts/migrate.ts
##
## See `packages/database/CLAUDE.md` for why the proxy exists and
## `docker/local-neon-http-proxy/` for its (vendored, CC0-licensed) source.

# An explicit project name keeps this stack's containers/network isolated
# from anything else `docker compose` manages in this working directory —
# without it, Compose derives the project name from the directory (here,
# "protokit"), which can collide with an unrelated stack of the same name.
name: protokit-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: protokit
      POSTGRES_PASSWORD: protokit
      POSTGRES_DB: protokit_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protokit -d protokit_test']
      interval: 2s
      timeout: 5s
      retries: 30

  neon-proxy:
    build:
      context: ./docker/local-neon-http-proxy
      dockerfile: Dockerfile
    environment:
      PG_CONNECTION_STRING: postgres://protokit:protokit@postgres:5432/protokit_test
    ports:
      - '4444:4444'
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
